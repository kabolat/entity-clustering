name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }} --group dev
      - run: uv run --python ${{ matrix.python }} ruff check src tests
      - run: uv run --python ${{ matrix.python }} pytest
