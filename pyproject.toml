[project]
name = "entity-clustering"
version = "0.2.0"
description = "Reproducible probabilistic clustering of rooftop PV systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kutay Bölat" }]
dependencies = [
  "fastnanquantile==0.0.2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.13,<2",
  "typer>=0.12,<1",
]

[project.scripts]
entity-clustering = "entity_clustering.cli:app"

[dependency-groups]
dev = [
  "jupyterlab>=4.3,<5",
  "nbclient>=0.10,<1",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_clustering"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
